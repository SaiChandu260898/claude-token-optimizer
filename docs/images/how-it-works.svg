<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220">
  <rect width="1000" height="220" fill="#f2f1ec"/>
  <g font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#111111">
    <rect x="30" y="40" width="210" height="120" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
    <text x="135" y="82" text-anchor="middle" font-size="17" font-weight="700">Your big docs</text>
    <text x="135" y="110" text-anchor="middle" font-weight="700" fill="#6b6b6b">~11,000 tokens</text>
    <text x="135" y="132" text-anchor="middle" font-size="12" fill="#6b6b6b">every single session</text>
    <path d="M250,100 L282,100 M273,92 L284,100 L273,108" stroke="#111111" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="292" y="80" width="116" height="40" fill="#111111"/>
    <text x="350" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">this tool</text>
    <path d="M418,100 L450,100 M441,92 L452,100 L441,108" stroke="#111111" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="462" y="40" width="240" height="120" fill="#ffffff" stroke="#d63a2f" stroke-width="3"/>
    <text x="582" y="76" text-anchor="middle" font-size="17" font-weight="700" fill="#d63a2f">Always loaded</text>
    <text x="582" y="104" text-anchor="middle">a short cheat sheet</text>
    <text x="582" y="136" text-anchor="middle" font-size="20" font-weight="700" fill="#d63a2f">~800 tokens</text>
    <text x="721" y="108" text-anchor="middle" font-size="24" font-weight="700" fill="#6b6b6b">+</text>
    <rect x="740" y="40" width="230" height="120" fill="#ffffff" stroke="#111111" stroke-width="2.5" stroke-dasharray="8 6"/>
    <text x="855" y="76" text-anchor="middle" font-size="17" font-weight="700">On demand</text>
    <text x="855" y="104" text-anchor="middle">old notes and docs</text>
    <text x="855" y="134" text-anchor="middle" font-size="20" font-weight="700">0 tokens</text>
    <text x="855" y="152" text-anchor="middle" font-size="11" fill="#6b6b6b">until Claude reads them</text>
    <text x="500" y="196" text-anchor="middle" font-size="13" fill="#6b6b6b">Claude still opens them whenever it needs them</text>
  </g>
</svg>
