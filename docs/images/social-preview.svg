<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#0d1117"/>
  <rect x="0" y="0" width="12" height="640" fill="#3fb950"/>
  <text x="80" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#f0f6fc">claude-token-optimizer</text>
  <text x="80" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" fill="#9da7b3">Cut the tokens Claude Code loads at session start</text>
  <rect x="80" y="262" width="640" height="68" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="108" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" fill="#3fb950">$</text>
  <text x="146" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" fill="#f0f6fc">npx claude-token-optimizer init</text>
  <text x="80" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#9da7b3">Startup ~11,000 tokens</text>
  <rect x="80" y="434" width="1120" height="44" rx="6" fill="#484f58"/>
  <text x="80" y="536" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#3fb950">~800 tokens</text>
  <rect x="80" y="552" width="81" height="44" rx="6" fill="#3fb950"/>
</svg>
